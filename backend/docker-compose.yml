name: forte-backend-docs

services:
  swagger:
    image: docker.swagger.io/swaggerapi/swagger-ui:v5.33.1
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
      VALIDATOR_URL: none
      SUPPORTED_SUBMIT_METHODS: "[]"
      PERSIST_AUTHORIZATION: "false"
      DEEP_LINKING: "true"
      DISPLAY_OPERATION_ID: "true"
    volumes:
      - type: bind
        source: ./docs/openapi.yaml
        target: /spec/openapi.yaml
        read_only: true
        bind:
          create_host_path: false
